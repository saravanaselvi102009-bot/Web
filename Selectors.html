<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Selectors</title>
        <style>
            /* 1.Element selector */
            p {
                color:crimson;
            }

            /* 2.Class Selector */
            .Saravana{
                color:blue;
                background-color:blanchedalmond;
            }

             /* 3. ID Selector */
            #Gopika {
             color:blue;
             font-size:24px;
            }
        </style>
</head>
<body>
    <h1>CSS Selectors</h1>

    <!--- Element Selector --->
    <p>This is paragraph 1.</p>
    <p>This is paragraph 2.</p>

    <!-- Class Selector -->
     <p class="Saravana">This is highlighted text</p>
     <h2 class="Saravana">This heading also uses the class.</h2>

     <!-- ID Selector -->
      <p id="Gopika">This is special.</p>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal CSS</title>
<style>

    /* Styling all <h1> elements */
    h1 {
        color:midnightblue;
        text-align:left;
    }

    /* Styling all <h2> elements */
    h2{
        color:darkgrey;
        text-decoration: underline;
    }

     /*Styling the mark*/
    mark{
            background-color: aquamarine;
          }

    /*Styling all <p> elements */
    p {
        color:darkcyan;
        font-size: 20px;
    }
    
    /*Styling the list*/
    ul{
        color:blueviolet;
        font-size: 18px;
    }

    /*Styling list items*/
    li{
        margin:8px;
    }

    /* Styling the button */
    button {
            background-color:rgb(42, 62, 7);
            color:bisque;
            padding:7px 10px;
            border:none;
            border-radius: 5px;
            font-size: 12px;
    }
        
    /* Styling the Table */
    table{
            border-collapse:cornsilk;
            width: 30%;
    }

    th {
        background-color: darkblue;
        color:antiquewhite;
        padding:5px;
    }

    td{
        background-color: beige;
        width:60px;
    }

    /*Styling horizontal line */
    hr{
        border: 2px solid sandybrown;
    }

    /*Styling the image*/
    img {
        width:200px;
        border: 5px solid rgb(63, 3, 3);
        border-radius:10px;
    }

    /* Styling links */
            a {
                color:crimson;
                text-decoration: none;
                font-size: 18px;
            }
            
</style>
</head>
<body>
    <h1>My website</h1>
    <p>This is an example of <mark>internal css.</mark></p>
    <p>We can style multiple elements using internal CSS.</p>
    <table border="2">
        <tr>
            <th>S.no</th>
            <th>Telugu</th>
            <th>Hindi</th>
            <th>English</th>
            <th>Maths</th>
            <th>General Science</th>
            <th>Social</th>
        </tr>
        <tr>
            <td>1</td>
            <td>97</td>
            <td>94</td>
            <td>99</td>
            <td>99</td>
            <td>94</td>
            <td>99</td>
        </tr>
        </table>
        <br>
        <button>click me</button>
        <li>
            <ul>
                <li>I'm Saravana</li>
                <li>I love listening to music</li>
                <li>Creating my own sunshine</li>
            </ul>
        </li>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQHzWQOx8LBPk9TatZCStsdFTWnDtR-0N320N0vdImu4A&s=10" height=300px width=250px alt="Dairymilk">
        <a href="https://www.youtube.com/watch?v=cBsQC5ymdbo" target="_self">click here to meet <i>sachien</i> Trailer</a>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
</head>
<body>
    <h1 style="color:blueviolet; text-align:  center;">
        My website
    </h1>
    
    <!--The style is applied directly to this paragraph-->
    <p style="color:blue; font-size: 20px;">
        This is an example of inline css.
    </p>

    <!--Another element with its own style-->
    <button style="background-color:black; color:azure;">
        Click me
    </button>

</body>
</html>

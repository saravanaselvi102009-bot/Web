<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
</head>
<body>
    <h1 style="color:rgb(29, 8, 49); text-align:  center;">
        My website
    </h1>
    
    <!--The style is applied directly to this paragraph-->
    <p style="color:rgb(6, 6, 252); font-size: 20px;">
        This is an example of inline css.
    </p>

    <!--Another element with its own style-->
    <button style="background-color:rgba(14, 12, 12, 0.84); color:rgb(165, 227, 227);">
        Click me
    </button>

</body>
</html>

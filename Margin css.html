<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margins</title>
    <style>
        h1{
            border:2px solid rgb(70, 155, 70);
            margin: 20px;
        }
         /* Different margins on each side */

         p{
           border: 2px solid rgb(216, 112, 147);

           margin-top:10px;  /* Top space */
           margin-right: 20px; /* Right space */
           margin-bottom: 30px;/* bottom space */
           margin-left: 40px;/* Left space */
         }

         /* Two values: top/bottom and left/right */
         h2{
            border: 2px solid rgb(106, 90, 205);
            margin: 30px 40px;
         }

        /* Auto margin centers the box horizontally */
        div{
            width:200px;
            border: 2px solid rgb(177, 44, 44);
            margin: 20px auto;
            padding: 30px;
        }

        h6{
            border:1px dotted rgb(125, 125, 234);
            margin:20px;
            padding:30px;
        }

    </style>
</head>
<body>
    <h1>Director:</h1>
    <h2>Jason Sanjay</h2>
    <p>The 1st film by Jason Sanjay,<i>"Illaya Thalapathy"</i></p>
    <div>
        <ul>
            <li>MOVIE:Sigma</li>
            <li>HERO:Sundeep Kishan</li>
            <li>HEROINE:Faria Abdullah</li>
            <li>Music Director:S.Thaman</li>
        </ul>
    </div>

    <h6 class="highlighted">M.Saravana..</h6>
</body>
</html>



<!--margin: 20px; ~ All four sides.

margin: 10px 20px; ~ Top/bottom and left/right.

margin: 10px 20px 30px 40px; ~ Top , right ,bottom , left.

margin:auto; ~ can center a box horizontally when it has a specified width.-->

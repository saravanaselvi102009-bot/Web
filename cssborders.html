<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Borders</title>
      <style>
        h1{
            color:darkgreen;
            background-color: antiquewhite;
            text-align: center;
            font-size:large;
            font-weight: 200;
        }
    
        p{
            color:goldenrod;
        }

        .box1{
            border: dashed steelblue;
            border-radius: 3px;
        }

        .box2{
            border: dotted cornflowerblue;
            border-radius: 20px;
        }

        .box3{
            border: double slateblue;
            border-radius: 20px;
        }

        .box4{
            border: solid darkblue;
            border-radius: 20px;
        }
      </style>
</head>
<body>
    <h1>CSS Borders</h1>

    <P>This paragraph has a solid border</P>

    <P class="box1">This ia a dashed border.</P>
    <p class="box2">This is a dotted border.</p>
    <p class="box3">This is a double border.</p>
    <p class="box4">This ia a solid border.</p>
    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selectors</title>
    <style>
        h1{
            color:blueviolet;
            text-align: center;
            font-size:25px;
        }
        h2{
            color:chartreuse;
            font-size:medium;
        }

        p{
            color:darkmagenta;
        }
        .Skills{
            color:blue;
            background-color:mistyrose;
            font-size: 25px;
            font-weight: 100px;
        }
        #Goal{
            color:darksalmon;
            font-size:20px;
        }
    </style>
    
</head>
<body>
    <!--Element selector-->
    <h1>About Me</h1>

    <h2>A CSE Student</h2>

    <p>I'm Saravana.I'm very interested in learning new things</p>
    <p>Creating My own sunshine</p>

    <!--Class selector-->
    <p class="Skills">
        Java
        Python
        Web Technology
    </p>

    <!--ID Selector-->
<p id="Goal">
    I want to be placed in a high payed job.
</p>
    
</body>
</html>

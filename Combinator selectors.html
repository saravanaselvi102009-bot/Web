<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combinator selectors</title>
    <link rel="stylesheet" href="Combinator selectors.css">
</head>
<body>
    <div>
        <h2>Child selector</h2>

        <p>Descendent Selectors</p>

        <section>
            <p>This is also a descendent</p>
        </section>
    </div>
    
    <h3>Adjacent sibling</h3>
    <p>This paragraph is immediately after h3</p>

    <h4>General sibling</h4>
    <p>This is a general sibling.</p>
    <p>This is an another general sibling.</p>
    
</body>
</html>
